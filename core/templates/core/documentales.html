{% extends 'core/base.html' %}
{% load static %}

{% block title %}FilmScoper - Documentales{% endblock %}

{% block content %}
<header>
    <div class="filmscoper-icon">
        <img src="{% static 'core/img/icons/filmscoperlogo.svg' %}" alt="FilmScoper Logo">
    </div>
    <h1>Documentales</h1>
</header>
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2 col-md-3 col-sm-4 col-6 mb-4">
            <div class="item-container">
                <a href="{% url 'core:pelicula' %}?movie=pulpo">
                    <div class="item">
                        <img src="{% static 'core/img/documentales/mi-maestro-pulpo.webp' %}" alt="Mi Maestro Pulpo">
                        <div class="info-overlay">
                            <h3>Mi Maestro Pulpo</h3>
                            <p class="year">2020</p>
                            <p class="genre">Documental</p>
                            <p class="rating">★★★★★ 8.1</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
