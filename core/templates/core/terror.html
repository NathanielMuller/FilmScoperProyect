{% extends 'core/base.html' %}
{% load static %}

{% block title %}FilmScoper - Películas de Terror{% endblock %}

{% block content %}
<header>
    <div class="filmscoper-icon">
        <img src="{% static 'core/img/icons/filmscoperlogo.svg' %}" alt="FilmScoper Logo">
    </div>
    <h1>Películas de Terror</h1>
</header>
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2 col-md-3 col-sm-4 col-6 mb-4">
            <div class="item-container">
                <a href="{% url 'core:pelicula' %}?movie=it-follows">
                    <div class="item">
                        <img src="{% static 'core/img/terror/it-follows.webp' %}" alt="It Follows">
                        <div class="info-overlay">
                            <h3>It Follows</h3>
                            <p class="year">2014</p>
                            <p class="genre">Terror</p>
                            <p class="rating">★★★★☆ 6.8</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
