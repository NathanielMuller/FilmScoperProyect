{% extends 'core/base.html' %}
{% load static %}

{% block title %}FilmScoper - Recuperar Contraseña{% endblock %}

{% block content %}
<div class="container mt-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">Recuperar Contraseña</h2>
                    
                    <div id="stepOneForm">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="recoveryEmail" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="recoveryEmail" name="email" required>
                                <div class="invalid-feedback">
                                    Por favor ingresa un correo válido.
                                </div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Enviar Código</button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <a href="{% url 'core:iniciar_sesion' %}" class="text-muted">Volver al inicio de sesión</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'core/js/recuperar-password.js' %}"></script>
{% endblock %}
