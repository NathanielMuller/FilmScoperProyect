{% extends 'core/base.html' %}
{% load static %}

{% block title %}FilmScoper - Películas Románticas{% endblock %}

{% block content %}
<header>
    <div class="filmscoper-icon">
        <img src="{% static 'core/img/icons/filmscoperlogo.svg' %}" alt="FilmScoper Logo">
    </div>
    <h1>Películas Románticas</h1>
</header>
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2 col-md-3 col-sm-4 col-6 mb-4">
            <div class="item-container">
                <a href="{% url 'core:pelicula' %}?movie=titanic">
                    <div class="item">
                        <img src="{% static 'core/img/romantica/titanic.webp' %}" alt="Titanic">
                        <div class="info-overlay">
                            <h3>Titanic</h3>
                            <p class="year">1997</p>
                            <p class="genre">Romance</p>
                            <p class="rating">★★★★☆ 7.9</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
